framework:
    cache:
        default_redis_provider: '%env(REDIS_URL)%'

        # Dedicated, tag-aware pool for the product catalog cache: tags let us
        # invalidate every cached listing page/filter combination in one call
        # (invalidateTags(['products'])) instead of tracking individual keys.
        pools:
            products.cache:
                adapter: cache.adapter.redis
                tags: true

when@test:
    framework:
        cache:
            pools:
                products.cache:
                    adapter: cache.adapter.array
                    tags: true
